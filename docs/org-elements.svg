<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 472" width="880" height="452" font-family="&#39;Latin Modern Roman&#39;,&#39;CMU Serif&#39;,Georgia,serif">
  <rect x="0" y="0" width="880" height="472" fill="#ffffff"></rect>

  
  <text x="40" y="34" font-size="13" fill="#475569" letter-spacing="1.4">THE FILE, IN READING ORDER</text>
  <text x="412" y="34" font-size="13" fill="#475569" letter-spacing="1.4">THE ELEMENTS THAT OWN THOSE LINES</text>
  <line x1="40" y1="44" x2="840" y2="44" stroke="#a1a1aa" stroke-width="1"></line>

  
  <rect x="402" y="118" width="438" height="243" fill="#fcfcfd"></rect>

  
  <g font-family="&#39;Latin Modern Mono&#39;,&#39;CMU Typewriter Text&#39;,Consolas,monospace" font-size="17">
    <rect x="40" y="68" width="352" height="26" fill="#dbeafe" stroke="#2563eb" stroke-width="1"></rect>
    <text x="52" y="86" fill="#1e3a8a">#+title: demo</text>

    <rect x="40" y="122" width="352" height="26" fill="#fef3c7" stroke="#d97706" stroke-width="1"></rect>
    <text x="52" y="140" fill="#78350f">* Chapter</text>

    <rect x="40" y="156" width="352" height="26" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"></rect>
    <text x="52" y="174" fill="#111827">Some prose.</text>

    <rect x="40" y="210" width="352" height="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"></rect>
    <text x="52" y="228" fill="#4c1d95">#+name: greet</text>

    <rect x="40" y="244" width="352" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1"></rect>
    <text x="52" y="262" fill="#14532d">#+begin_src go :tangle greet.go</text>

    <rect x="40" y="278" width="352" height="26" fill="#ffffff" stroke="#9ca3af" stroke-width="1"></rect>
    <text x="52" y="296" fill="#374151">package greet</text>

    <rect x="40" y="312" width="352" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1"></rect>
    <text x="52" y="330" fill="#14532d">#+end_src</text>
  </g>

  
  <g font-family="&#39;Latin Modern Mono&#39;,&#39;CMU Typewriter Text&#39;,Consolas,monospace" font-size="12" fill="#94a3b8">
    <line x1="40" y1="108" x2="392" y2="108" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="3 3"></line>
    <text x="44" y="105">(blank line)</text>
    <line x1="40" y1="196" x2="392" y2="196" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="3 3"></line>
    <text x="44" y="193">(blank line)</text>
    <line x1="40" y1="352" x2="392" y2="352" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="3 3"></line>
    <text x="44" y="349">(blank line)</text>
  </g>

  
  <g fill="none" stroke="#a1a1aa" stroke-width="1.4">
    <path d="M 402 68 H 412 V 115 H 402"></path>
    <path d="M 402 122 H 412 V 359 H 402"></path>
  </g>
  <g fill="#111827" font-size="18">
    <text x="428" y="86">keyword</text>
    <text x="428" y="180">headline</text>
  </g>
  <g fill="#475569" font-size="13">
    <text x="428" y="103">one line</text>
    <text x="428" y="198">the heading line, plus</text>
    <text x="428" y="214">every element below it</text>
    <text x="428" y="230">until the next headline</text>
  </g>

  
  <line x1="592" y1="135" x2="612" y2="135" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="3 3"></line>
  <text x="618" y="139" font-size="13" fill="#475569">its own heading line</text>

  
  <g fill="none" stroke="#a1a1aa" stroke-width="1.4">
    <path d="M 592 156 H 602 V 203 H 592"></path>
    <path d="M 592 210 H 602 V 359 H 592"></path>
  </g>
  <g fill="#111827" font-size="18">
    <text x="618" y="174">paragraph</text>
    <text x="618" y="264">src-block</text>
  </g>
  <g fill="#475569" font-size="13">
    <text x="618" y="191">one line</text>
    <text x="618" y="282">four lines: the affiliated</text>
    <text x="618" y="298">#+name, the begin line, the</text>
    <text x="618" y="314">body, the end line</text>
  </g>

  
  <line x1="40" y1="400" x2="840" y2="400" stroke="#a1a1aa" stroke-width="2"></line>
  <g font-size="14" fill="#475569">
    <text x="40" y="424">Vertical position is position in the file: the seven lines read top to bottom, exactly as typed.</text>
    <text x="40" y="446">Horizontal nesting is containment: a bracket owns every line it spans, and a bracket to its right is a child of it.</text>
    <text x="40" y="468">A blank line is not an element. It counts as trailing space on the element above it, inside that element's extent.</text>
  </g>
</svg>